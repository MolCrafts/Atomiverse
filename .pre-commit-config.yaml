# THE quality gate for Atomiverse (GitHub Actions is not on push).
#
#   pre-commit  → format / hygiene (fast)
#   pre-push    → tools/ci_cpu_unit.sh — same cmake + ctest the optional
#                 workflow_dispatch CI job would run
#
# Install both:
#   pre-commit install
#   pre-commit install --hook-type pre-push
# (default_install_hook_types below also installs both on `pre-commit install`)
#
# clang-format pin matches local 22.1.x.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        types_or: [c, c++, cuda]

  - repo: local
    hooks:
      - id: atv-cpu-unit
        name: CI CPU unit (cmake + ctest)
        entry: tools/ci_cpu_unit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
