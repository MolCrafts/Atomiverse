concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
name: ci

# Intentionally NOT on push/PR. Local pre-commit / pre-push is the gate:
#   pre-commit  → format / hygiene
#   pre-push    → cmake -P cmake/AtvUnitGate.cmake  (path-scoped modules)
# Multi-backend (CUDA etc.) is machine-local (login node / GPU job), not
# GitHub-hosted. Manual re-run only when you want a second opinion:
#   gh workflow run CI.yml
'on':
  workflow_dispatch:
    inputs:
      hf_benchmark_tier:
        description: HF benchmark coverage (large CUDA performance campaigns run through molq)
        type: choice
        options: [smoke, acceptance]
        default: smoke

env:
  CARGO_TERM_COLOR: always

jobs:
  context:
    permissions:
      contents: read
    name: ci / context
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  pre-commit:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  cpu:
    if: needs.context.outputs.skip-pr != 'true'
    name: ci / CPU unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
    - context
    - pre-commit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev libfftw3-dev

      - uses: actions/checkout@v4
        with:
          repository: MolCrafts/molpy
          ref: dev
          path: molpy-source

      - name: Select molpy source (unpinned dev)
        run: echo "ATV_MOLPY_PATH=$GITHUB_WORKSPACE/molpy-source" >> "$GITHUB_ENV"

      # Full optional slice on manual GHA (path gate is local pre-push).
      - name: CPU unit (cmake gate, all modules)
        run: cmake -DATV_GATE_ALL=1 -P cmake/AtvUnitGate.cmake

  workflow-policy:
    name: ci / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: MolCrafts/molcrafts-ci/actions/check-workflows@master

  hf-benchmark:
    name: ci / HF scientific benchmark
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ATV_MOLPY_PATH: ${{ github.workspace }}/build/benchmark-partners/molpy
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-unknown-linux-gnu
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Select the molpy 0.20 release ABI toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-pthread-dev liblapack-dev ninja-build
      - uses: actions/checkout@v4
        with:
          repository: MolCrafts/molpy
          ref: v0.20.0
          path: build/benchmark-partners/molpy
      - uses: actions/checkout@v4
        with:
          repository: MolCrafts/molcrafts-ci
          ref: dev
          path: build/benchmark-partners/molcrafts-ci
      - name: Install benchmark runtime and observation protocol
        run: |
          python -m pip install -e build/benchmark-partners/molcrafts-ci
          python -m pip install './python[native]' -r benchmarks/requirements.txt pytest
          python -c "from molci import Manifest; assert 'observation_id' in Manifest.model_fields"
          python -c "from importlib.metadata import version; assert version('molcrafts-molpy') == '0.20.0'"
      - name: Build and install the public HF extension
        id: native
        run: |
          cmake -S . -B build/hf-benchmark-native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(command -v python)" \
            -DRust_TOOLCHAIN="$RUSTUP_TOOLCHAIN" -DCORROSION_TOOLS_RUST_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            -DATV_BUILD_HF=ON -DATV_BUILD_PYTHON=ON -DATV_BUILD_EVALUATE=ON \
            -DATV_USE_MPI=OFF \
            -DATV_BUILD_{CUDA,PW,GPW,KSPACE,TESTS,BENCHMARKS,EXAMPLES,LAUNCHER}=OFF \
            -DATV_BUILD_{MD,MC,MINIMIZER,VIB,PATH,SEMIEMPIRICAL,POTENTIALS,NEIGHBOR,ANALYSIS}=OFF
          python -m benchmarks attest-build --build-dir build/hf-benchmark-native \
            --jobs 2 --out build/hf-build-receipt.json
          cmake --install build/hf-benchmark-native --component python \
            --prefix "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
      - name: Validate the benchmark framework and public bindings
        run: python -m pytest tests/benchmarks python/tests/test_hf_bindings.py -q
      - name: Run independent HF comparisons
        id: benchmark
        env:
          BENCHMARK_TIER: ${{ inputs.hf_benchmark_tier }}
        run: |
          # SCF methods only: forcefield.gaff needs SEMIEMPIRICAL and AmberTools.
          python -m benchmarks run --tier "$BENCHMARK_TIER" --threads 1 \
            --method rhf --method uhf --method rohf --method ghf \
            --method rks --method uks \
            --repeats 1 --warmup 0 --timeout 600 \
            --build-receipt build/hf-build-receipt.json --out build/hf-benchmark-results
      - name: Rebuild and validate the report after scientific failures
        if: always() && hashFiles('build/hf-benchmark-results/results.json') != ''
        run: |
          python -m benchmarks report --input build/hf-benchmark-results/results.json \
            --out build/hf-benchmark-results
          molci validate-snapshot build/hf-benchmark-results/snapshots/benchmark.json
      - name: Submit the untracked benchmark observation
        if: always() && hashFiles('build/hf-benchmark-results/snapshots/benchmark.json') != ''
        uses: ./build/benchmark-partners/molcrafts-ci/actions/submit
        with:
          snapshot-path: build/hf-benchmark-results/snapshots/benchmark.json
          project: atomiverse
          artifact-name: hf-benchmark-observation
      - name: Preserve all numerical and hardware evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hf-benchmark-evidence
          path: |
            build/hf-benchmark-results/
            build/hf-benchmark-native/CMakeCache.txt
            build/hf-build-receipt.json
            build/hf-build-receipt.build.log
          if-no-files-found: warn
