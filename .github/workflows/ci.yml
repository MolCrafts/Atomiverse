name: CI

# Intentionally NOT on push/PR. Local pre-commit / pre-push is the gate:
#   pre-commit  → format / hygiene
#   pre-push    → tools/ci_cpu_unit.sh  (cmake + unit ctest)
# Multi-backend (CUDA etc.) is machine-local (login node / GPU job), not
# GitHub-hosted. Manual re-run only when you want a second opinion:
#   gh workflow run CI.yml
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  cpu:
    name: CPU unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev

      - name: Report molrs submodule pin
        run: |
          echo "molrs submodule:"
          git -C molrs rev-parse HEAD
          git -C molrs describe --tags --always
          cat molrs/molrs-cxxapi/CXX_API_VERSION

      - name: CPU unit (same script as local pre-push)
        env:
          # Default CMake path is ./molrs (submodule); keep explicit for clarity.
          ATV_MOLRS_PATH: ${{ github.workspace }}/molrs
          ATV_CI_BUILD_DIR: build
        run: bash tools/ci_cpu_unit.sh
