name: nightly
'on':
  workflow_dispatch:
    inputs:
      hf_benchmark_tier:
        description: Independent HF benchmark coverage
        type: choice
        options: [smoke, acceptance]
        default: smoke
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  context:
    name: nightly
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@54799bfe986f247edd1788e6242673a527400306
    with:
      profile: cpp-python
  benchmark:
    name: nightly / HF scientific benchmark
    needs: context
    if: needs.context.outputs.nightly == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.context.outputs.source-ref }}
          persist-credentials: false
      - uses: MolCrafts/molcrafts-ci/actions/setup-molci@54799bfe986f247edd1788e6242673a527400306
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@54799bfe986f247edd1788e6242673a527400306
      - uses: MolCrafts/molcrafts-ci/actions/setup-cpp-python@54799bfe986f247edd1788e6242673a527400306
        with:
          scope: hf-benchmark
      - run: molci run benchmark-hf
        env:
          MOLCI_BENCHMARK_TIER: ${{ inputs.hf_benchmark_tier || 'smoke' }}
      - name: Report scientific failures
        if: always() && hashFiles('build/hf-benchmark-results/results.json') != ''
        run: molci run benchmark-report
      - name: Preserve numerical and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hf-benchmark-evidence
          path: |
            build/hf-benchmark-results/
            build/hf-build-receipt*
            build/molci/hf/cmake/CMakeCache.txt
            .git/molci/logs/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Submit the untracked scientific observation
        if: always() && hashFiles('build/hf-benchmark-results/snapshots/benchmark.json') != ''
        uses: MolCrafts/molcrafts-ci/actions/submit@54799bfe986f247edd1788e6242673a527400306
        with:
          snapshot-path: build/hf-benchmark-results/snapshots/benchmark.json
          project: atomiverse
          artifact-name: hf-benchmark-observation
