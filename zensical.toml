[project]
site_name = "Atomiverse"
site_description = "Unified molecular simulation engine. Different methods live in one engine and share the same way of building and running a calculation."
site_author = "MolCrafts"
site_url = "https://molcrafts.github.io/Atomiverse/"
copyright = "Copyright &copy; 2026 MolCrafts"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/MolCrafts/Atomiverse"
repo_name = "MolCrafts/Atomiverse"
edit_uri = "edit/dev/docs/"

# MolVis + MolPlot share one model (see molcrafts-zensical-theme README):
#   build-time fence → theme formatters (no molvis/molplot Python packages)
#   run-time element  → npm CDN below (or staged node_modules)
# MolVis: load the staged monorepo bundle (docs/assets/molvis-core/). The
# published npm package (@molcrafts/molvis-core@0.0.10) does not ship
# dist/elements.js yet — jsDelivr returns 404 for that path. MolPlot is fine
# on the CDN.
extra_javascript = [
  { path = "assets/javascripts/molvis-elements.js", type = "module" },
  { path = "https://cdn.jsdelivr.net/npm/@molcrafts/molplot@latest/dist/elements.js", type = "module" },
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

