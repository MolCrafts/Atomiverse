[build-system]
# Default delivery is a pure-Python wheel (wheel.cmake = false below). The
# native extension is built from a source checkout by `python -m atomiverse
# compile`, which runs `pip wheel --no-build-isolation -C wheel.cmake=true` in
# the user's environment — hence the `native` extra.
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "atomiverse"
# Single source: __version__ in src/atomiverse/__init__.py. A release tag
# vX.Y.Z must equal it (.github/workflows/release.yml checks).
dynamic = ["version"]
description = "Molecular simulation compute backend (CPU + optional CUDA)"
readme = "README.md"
license = "GPL-2.0-only"
# molcrafts-molpy (the Frame currency) requires >=3.12.
requires-python = ">=3.12"
# The local molpy wheel and CXX bridge must come from the same tree.
# No molpy release version is pinned.
dependencies = ["numpy", "molcrafts-molpy", "typer>=0.12"]

[project.optional-dependencies]
dev      = ["pytest", "pytest-cov", "numpy"]
# Native extension build (`python -m atomiverse compile`): scikit-build-core
# and nanobind for the extension, maturin for molpy from the local checkout. Not
# required for the pure wheel; the build runs without isolation, so all three
# live in this env.
native   = ["nanobind>=2.4", "scikit-build-core>=0.10", "maturin>=1.0,<2.0"]
benchmark = ["pyscf>=2.11,<3", "threadpoolctl>=3.5", "pydantic>=2.11"]
# Docs: only the theme (+ zensical). MolVis and MolPlot fences both live in
# molcrafts-zensical-theme; browser bundles load from the npm CDN in
# zensical.toml. Do NOT add molcrafts-molplot here.
docs     = [
  "zensical>=0.0.45",
  "molcrafts-zensical-theme>=0.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[dependency-groups]
ci = ["build>=1.2", "twine>=6", "pip>=25", "molcrafts-ci>=0.3"]

[tool.uv.sources]
molcrafts-molpy = { git = "https://github.com/MolCrafts/molpy", rev = "2ba2b2d974d036da8823e13f4a6c9236bfe46f3f", subdirectory = "molpy" }
molcrafts-ci = { git = "https://github.com/MolCrafts/molcrafts-ci", rev = "649888661aa133bcdbbc9d8e5702517a6accb1a1" }

[tool.coverage.run]
source = ["src/atomiverse"]

# ── scikit-build-core ──────────────────────────────────────────────────────────

[tool.scikit-build]
# Pin behavior to this release's defaults even when upgrading the tool
minimum-version = "build-system.requires"

# CMakeLists.txt lives at the repo root, one level above python/
cmake.source-dir = ".."
cmake.build-type = "Release"

# Separate build tree for wheel builds (avoids collisions with dev builds in build/)
build-dir = "build/skbuild/{wheel_tag}"

# Python package source tree (src-layout)
wheel.packages = ["src/atomiverse"]

# Default: pure-Python wheel — no CMake / no C++ compile at pip install time.
# The native wheel is `python -m atomiverse compile` (-C wheel.cmake=true plus
# an explicit cmake.define per product module), installed by pip so the
# extension is a RECORD-tracked file of the distribution.
wheel.cmake = false

# Only the `python` CMake component (extension, _build_info.json, launcher)
# goes into the wheel — vendored dependencies' own install rules (xtensor,
# xsimd, … headers and CMake configs) must not land in site-packages.
install.components = ["python"]

metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "src/atomiverse/__init__.py"

# Editable installs: redirect mode injects a finder that delegates to both
# the CMake install tree and the Python source tree
editable.mode = "redirect"
editable.rebuild = false
editable.verbose = true

# sdist: exclude generated and build artefacts
sdist.exclude = [
    "build/**",
    "docs/html/**",
    ".claude/**",
    "**/__pycache__/**",
]

# ── CMake defines ─────────────────────────────────────────────────────────────
# Only the switches that are fixed for every Python build. Product modules,
# MPI and precision tiers are chosen per build by `python -m atomiverse
# config`, which passes every one explicitly as -C cmake.define.KEY=VALUE.

[tool.scikit-build.cmake.define]
ATV_BUILD_PYTHON     = "ON"
ATV_BUILD_TESTS      = "OFF"
ATV_BUILD_BENCHMARKS = "OFF"
ATV_BUILD_EXAMPLES   = "OFF"
